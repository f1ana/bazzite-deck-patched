---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: bazzite-deck-patched
description: My personal Bazzite OS image with cyan-skillfish-governor included.

base-image: ghcr.io/ublue-os/bazzite-deck
image-version: latest

# modules
modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - filippor/bazzite
    install:
      packages:
        - umr
        - cyan-skillfish-governor-smu

  - type: files
    files:
      - source: system
        destination: /

  - type: systemd
    system:
      enabled:
        - cyan-skillfish-governor-smu.service

  - type: script
    scripts:
      - bc250-acpi-tables.sh

  # must stay after anything that changes dracut config or the ACPI tables
  - type: initramfs

  - type: signing
